[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bakudo"
version = "3.0.0"
description = "A durable, always-running meta-agent operating system: creates, runs, evaluates, and evolves specialized agents over time."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "bakudo" }]
keywords = ["meta-agent", "temporal", "strands", "abox", "agents", "llm"]

# Core dependencies are deliberately light so the control-plane domain logic
# (schemas, registry, evals, curriculum, memory policy) imports without any
# external services running. Heavier integrations live in optional extras.
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
# Durable orchestration backbone (Temporal workflows + activities).
temporal = ["temporalio>=1.7"]
# Authoritative ledger + relationship memory.
db = ["psycopg[binary]>=3.1", "falkordb>=1.0"]
# Worker-plane agent runtime + model access.
# strands >=1.45 reimplements structured_output via beta.chat.completions
# .parse with `tools: []`, which vLLM rejects (400: "`tools` must not be an
# empty array") — every in-guest report extraction fails. Verified live
# 2026-08-09: 1.44.0 OK, 1.45.0/1.50.0/1.51.0 FAIL. Lift the cap only after
# re-validating extraction against the live deployment.
runtime = ["strands-agents>=1.43,<1.45", "httpx>=0.27", "openai>=1.30"]
# Control-plane HTTP/dashboard surface. httpx is required by the API test
# client and by fastapi's TestClient-adjacent tooling; keeping it here (as
# well as in `runtime`) means `[api]` alone is enough to run the API tests.
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Everything, for a full local stack. The pins here MUST match the per-feature
# extras above — in particular the strands cap `>=1.43,<1.45` (see `runtime`):
# strands >=1.45 breaks in-guest structured-output extraction against vLLM.
# `tests/test_packaging.py` fails if this list drifts from the feature extras.
all = [
  "temporalio>=1.7",
  "psycopg[binary]>=3.1",
  "falkordb>=1.0",
  "strands-agents>=1.43,<1.45",
  "httpx>=0.27",
  "openai>=1.30",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
# Worker-plane entrypoint launched inside the abox sandbox.
agent-runner = "bakudo.runner.main:cli"
# Control-plane entrypoints.
bakudo-worker = "bakudo.temporal.worker:main"
bakudo-api = "bakudo.api.server:main"
bakudo = "bakudo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bakudo"]

# Ship schemas, skill packages, seed agent specs, tasks, and workload so
# the runtime can resolve them without the source tree being present (API-12;
# resolved via bakudo.paths).
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "bakudo/_data/schemas"
"skills" = "bakudo/_data/skills"
"agents" = "bakudo/_data/agents"
"smoke/tasks" = "bakudo/_data/smoke-tasks"
"smoke/workloads" = "bakudo/_data/smoke-workloads"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# We intentionally use the (str, Enum) idiom for pydantic-friendly enums whose
# JSON form is the member value; StrEnum's str() semantics differ.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
packages = ["bakudo"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
