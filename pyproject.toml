[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bakudo"
version = "3.0.0"
description = "A durable, always-running meta-agent operating system: creates, runs, evaluates, and evolves specialized agents over time."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "bakudo" }]
keywords = ["meta-agent", "temporal", "strands", "abox", "agents", "llm"]

# Core dependencies are deliberately light so the control-plane domain logic
# (schemas, registry, evals, curriculum, memory policy) imports without any
# external services running. Heavier integrations live in optional extras.
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
# Durable orchestration backbone (Temporal workflows + activities).
temporal = ["temporalio>=1.7"]
# Authoritative ledger + relationship memory.
db = ["psycopg[binary]>=3.1", "neo4j>=5.19"]
# Worker-plane agent runtime + model access.
runtime = ["strands-agents>=0.1", "httpx>=0.27", "openai>=1.30"]
# Control-plane HTTP/dashboard surface.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Everything, for a full local stack.
all = [
  "temporalio>=1.7",
  "psycopg[binary]>=3.1",
  "neo4j>=5.19",
  "strands-agents>=0.1",
  "httpx>=0.27",
  "openai>=1.30",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
# Worker-plane entrypoint launched inside the abox sandbox.
agent-runner = "bakudo.runner.main:cli"
# Control-plane entrypoints.
bakudo-worker = "bakudo.temporal.worker:main"
bakudo-api = "bakudo.api.server:main"
bakudo = "bakudo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bakudo"]

# Ship schemas and skill packages inside the wheel so the runtime can resolve
# them without the source tree being present.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "bakudo/_data/schemas"
"skills" = "bakudo/_data/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# We intentionally use the (str, Enum) idiom for pydantic-friendly enums whose
# JSON form is the member value; StrEnum's str() semantics differ.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
packages = ["bakudo"]
ignore_missing_imports = true
