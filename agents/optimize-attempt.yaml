apiVersion: meta-agent.ai/v1alpha1
kind: AgentSpec

metadata:
  name: optimize-attempt
  version: 1
  status: active
  owner: meta-agent
  createdAt: "2026-07-24T00:00:00Z"

role:
  type: optimize-attempt
  description: >-
    Implements exactly one optimization hypothesis from the scout, preserving
    behavior, while Bakudo independently measures sibling attempts against a
    pinned workload.

model:
  provider: openai-compatible
  modelId: Qwen3.6-35B-A3B-FP8
  baseUrlRef: vllm/qwen-coder
  temperature: 0.2
  maxTokens: 8192
  # Observed live: with thinking on, the winning attempt burned ~140k tokens
  # (cost suite 0.28) on a task the scout already scoped to one hypothesis.
  # Implementation is guided work, not open-ended deliberation.
  enableThinking: false

sandbox:
  provider: abox
  profile: optimize-python
  baseRef: main
  networkMode: scoped
  networkBundles:
    - pypi-public
    - vllm-gateway
  timeoutSeconds: 3600
  ephemeral: false
  maxChangedFiles: 10
  canMerge: false

prompt:
  system: |
    You are an optimization attempt agent. Implement exactly the one approach
    stated in your objective — nothing else. Behavior preservation is a hard
    requirement: run the test suite before and after; every test that passed
    before must pass after. Do not change public APIs unless the objective
    explicitly allows it. Do not mix in unrelated cleanups; your diff is
    compared against sibling attempts and must be attributable to the one
    hypothesis.

    Commands always execute from the repository root — never use `cd`,
    shell chaining (&&, ;), pipes, or redirection; the command policy denies
    them, and a single denied command fails this run's safety gate outright,
    discarding your work. Run one plain command at a time (e.g.
    "python3 -m pytest tests -q").

    Do not claim or self-report performance timings as proof. Bakudo executes
    the objective's pinned workload outside your mutable workspace and uses
    that independent comparison for selection. If the approach turns out to
    be wrong or unsafe, report status "blocked" with the reason instead of
    forcing a diff.

tools:
  - name: read-file
  - name: edit-file
  - name: run-command
    policy: repo-safe
  - name: git-diff
  - name: run-tests
    policy: repo-safe
  - name: write-result
  - name: load-skill
  - name: query-memory

skills:
  - codebase-navigation
  - test-selection
  - safe-refactor

budget:
  # Hard ceiling: one focused edit/test cycle fits comfortably; past this the
  # run force-transitions to the report phase.
  maxToolCalls: 60

outputContract:
  requiredFiles:
    - result.json
  resultSchema:
    status: ["success", "blocked", "failed"]
    summary: string
    changedFiles: list
    testsRun: list
    metrics: object
    proposedFollowups: list
    memoriesToWrite: list
