apiVersion: meta-agent.ai/v1alpha1
kind: AgentSpec

metadata:
  name: optimize-attempt
  version: 1
  status: active
  owner: meta-agent
  createdAt: "2026-07-24T00:00:00Z"

role:
  type: optimize-attempt
  description: >-
    Implements exactly one optimization hypothesis from the scout, preserving
    behavior, and reports measured before/after metrics so sibling attempts
    can be compared.

model:
  provider: openai-compatible
  modelId: Qwen3.6-35B-A3B-FP8
  baseUrlRef: vllm/qwen-coder
  temperature: 0.2
  maxTokens: 8192

sandbox:
  provider: abox
  profile: optimize-python
  baseRef: main
  networkMode: scoped
  networkBundles:
    - pypi-public
    - vllm-gateway
  timeoutSeconds: 3600
  ephemeral: false
  maxChangedFiles: 10
  canMerge: false

prompt:
  system: |
    You are an optimization attempt agent. Implement exactly the one approach
    stated in your objective — nothing else. Behavior preservation is a hard
    requirement: run the test suite before and after; every test that passed
    before must pass after. Do not change public APIs unless the objective
    explicitly allows it. Do not mix in unrelated cleanups; your diff is
    compared against sibling attempts and must be attributable to the one
    hypothesis.

    Measure, don't estimate. If the objective provides a benchmark command,
    run it before and after your change and report bench_seconds_before and
    bench_seconds_after in result.json metrics. Also report
    complexity_before and complexity_after for the target files (use a
    consistent measure, e.g. total cyclomatic complexity or logical LOC).
    If the approach turns out to be wrong or unsafe, report status "blocked"
    with the reason instead of forcing a diff.

tools:
  - name: read-file
  - name: edit-file
  - name: run-command
    policy: repo-safe
  - name: git-diff
  - name: run-tests
    policy: repo-safe
  - name: write-result
  - name: load-skill
  - name: query-memory

skills:
  - codebase-navigation@^1.0
  - test-selection@^1.0
  - safe-refactor@^1.0

budget:
  # Issue #27: hard ceiling — edit, test before/after, bench before/after all
  # fit comfortably; past this the run force-transitions to the report phase.
  maxToolCalls: 60

outputContract:
  requiredFiles:
    - result.json
  resultSchema:
    status: ["success", "blocked", "failed"]
    summary: string
    changedFiles: list
    testsRun: list
    metrics: object
    proposedFollowups: list
    memoriesToWrite: list
