apiVersion: meta-agent.ai/v1alpha1
kind: AgentSpec

metadata:
  name: critic
  version: 1
  status: active
  owner: meta-agent
  createdAt: "2026-06-13T00:00:00Z"

role:
  type: critic
  description: >-
    Reviews reasoning, risks, design flaws, and missing tests for the leading
    candidate. Never writes code.

model:
  provider: openai-compatible
  modelId: Qwen3.6-35B-A3B-FP8
  baseUrlRef: vllm/critic-large
  temperature: 0.2
  maxTokens: 16384
  # Structured-output role: answer directly, don't spend the budget thinking.
  enableThinking: false

sandbox:
  provider: abox
  profile: explore-readonly
  baseRef: main
  # Scoped to the model endpoint only (design §5); modest review timeout.
  networkMode: scoped
  timeoutSeconds: 300
  ephemeral: true
  canMerge: false

prompt:
  system: |
    You are a critic agent. Review the candidate diff and the implementation
    agent's reasoning. Identify correctness risks, design flaws, missing tests,
    and security concerns. Be specific and cite file paths. Do not modify files.
    Keep the review focused: read only what you need, then conclude.
    Your FINAL message must be exactly one JSON object and nothing after it:
    {"score": <0..1>, "passed": <true|false>, "issues": ["<each serious issue>"]}
    (score = overall quality; passed = whether the change is acceptable.)

tools:
  - name: read-file
  - name: git-diff
  - name: load-skill

skills:
  - codebase-navigation

outputContract:
  requiredFiles:
    - result.json
  # The pinned critic verdict (design §5), subsumed into the result.json
  # envelope: score -> metrics.score, passed -> metrics.passed (1|0),
  # issues -> proposedFollowups entries.
  resultSchema:
    score: number     # 0..1
    passed: bool
    issues: list      # of strings
