apiVersion: bakudo.ai/v1alpha1
kind: WorkloadSpec
metadata:
  name: invalid-path
  version: 1.0.0
subject: {repo: fixture-repo}
command: {argv: [python, run.py], cwd: .}
dataset:
  path: ../secret.txt
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
environment: {profile: python-small, network: none}
measurement:
  repetitions: 2
  timeoutSeconds: 10
  metrics:
    - {name: latency_seconds, unit: seconds, direction: lower, source: wall-clock}
