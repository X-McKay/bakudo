# Local development stack for the bakudo control plane (spec section 24).
#
#   cd infra && docker compose up -d
#
# Brings up Postgres (ledger), FalkorDB (graph memory), the Temporal cluster +
# UI, a vLLM gateway placeholder, and the bakudo worker + control API. Worker
# agents run in abox microVMs out-of-band; abox is not part of this compose
# file — see the worker service below for the default DEGRADED sandbox posture
# and how to enable real sandboxing (mount host abox + /dev/kvm).

name: bakudo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bakudo
      POSTGRES_PASSWORD: bakudo
      POSTGRES_DB: bakudo
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakudo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Graph memory mirror (issue #29: replaces Neo4j). Constraints + the vector
  # index are applied programmatically by the worker at boot via
  # FalkorGraphMemory.ensure_schema(), dimensioned from the wired embedder.
  # Auth is required (like the neo4j service it replaced): the published
  # 6379 would otherwise be an open Redis anyone on the host/LAN could
  # FLUSHALL. Credentials ride inside FALKORDB_URL.
  falkordb:
    image: falkordb/falkordb
    environment:
      REDIS_ARGS: --requirepass bakudo-dev-password
    ports: ["6379:6379"]
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bakudo-dev-password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal needs its own Postgres database; reuse the same server.
  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: bakudo
      POSTGRES_PWD: bakudo
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8080:8080"]

  # Placeholder for the internal vLLM OpenAI-compatible gateway (section 19.4).
  # Replace with your hosted vLLM deployment; the worker reaches it only through
  # the abox network allowlist bundle named "vllm-gateway".
  vllm-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["models"]
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./vllm-gateway/config.yaml:/etc/litellm/config.yaml:ro
    ports: ["4000:4000"]

  # SANDBOX POSTURE — DEGRADED BY DEFAULT (TMP-13).
  # The worker image contains no abox binary and the container has no KVM, so
  # sandbox runs are unavailable in the composed stack. BAKUDO_SANDBOX
  # defaults to `unavailable` to declare that truthfully: the worker starts
  # and serves non-sandbox activities (ledger, evals on stored results,
  # curriculum, memory compaction), logs the degraded posture loudly at
  # startup, and every sandbox-requiring run fails fast with an actionable
  # error — it never hangs or silently no-ops.
  #
  # *** BREAKING DEFAULT CHANGE *** This file used to ship
  # `BAKUDO_SANDBOX: abox` (which could not actually work without the mounts
  # below). If you had enabled real sandboxing by only adding the abox mount
  # and /dev/kvm, you must now ALSO set BAKUDO_SANDBOX=abox — via the
  # environment or a `.env` file next to this compose file (the value below
  # interpolates `${BAKUDO_SANDBOX:-unavailable}`), no file edit needed.
  #
  # To enable real sandboxing the host must have abox 0.7.1 and KVM; then:
  #   1. mount the host abox binary:
  #        volumes:
  #          - /usr/local/bin/abox:/usr/local/bin/abox:ro
  #   2. pass through the KVM device:
  #        devices:
  #          - /dev/kvm:/dev/kvm
  #   3. mount the target repos and point BAKUDO_REPO_ROOT at them
  #   4. export BAKUDO_SANDBOX=abox (or put it in infra/.env)
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["bakudo-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      BAKUDO_POSTGRES_DSN: postgresql://bakudo:bakudo@postgres:5432/bakudo
      FALKORDB_URL: falkor://:bakudo-dev-password@falkordb:6379
      BAKUDO_SANDBOX: ${BAKUDO_SANDBOX:-unavailable}
      VLLM_BASE_URL: http://vllm-gateway:4000/v1

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["bakudo-api"]
    depends_on: [worker]
    environment:
      BAKUDO_API_HOST: 0.0.0.0
      TEMPORAL_ADDRESS: temporal:7233
      # Same posture as the worker: by default POST /runs and /optimize
      # return an actionable 409 instead of an opaque "BAKUDO_SANDBOX must
      # be set".
      BAKUDO_SANDBOX: ${BAKUDO_SANDBOX:-unavailable}
    ports: ["8000:8000"]

volumes:
  pg-data:
  falkordb-data:
