# Python CI for bakudo.
#
# `make ci` is the single reproducible quality target.  It validates the uv
# lock, generated schemas, Ruff formatting/linting, typing, the hermetic test
# tier, offline CLI smoke surface, and wheel isolation.  Real Postgres,
# FalkorDB, Temporal, and abox/KVM tests remain explicit opt-in lanes because
# GitHub-hosted runners cannot provide a trustworthy instance of those systems.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - name: Reproducible quality gate
        run: make PYTHON=.venv/bin/python ci
