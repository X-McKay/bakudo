# Python CI for bakudo.
#
# Mirrors `make check` (ruff + mypy + pytest) plus an offline smoke test of
# the operator surface, on the same interpreters the package supports. It
# installs the full `[all,dev]` extras so pytest and mypy exercise the same
# surface as a fully-provisioned dev box (temporalio, strands, psycopg,
# httpx, fastapi) instead of silently skipping the heavy-dependency suites.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests skills
      # python -m avoids any stale mypy/pytest shadowing the venv's on PATH.
      - name: Type-check
        run: python -m mypy src/bakudo
      - name: Test
        run: python -m pytest
      - name: Smoke
        run: |
          bakudo doctor --json
          bakudo agent validate agents/add-feature.yaml
          bakudo agent validate agents/optimize-scout.yaml
          bakudo agent validate agents/optimize-attempt.yaml
          bakudo skill list --json
          bakudo demo --json
          bakudo optimize --repo bakudo --title "CI smoke" --rounds 1 --json
      # API-12 regression guard: the wheel must be a complete install —
      # builds it, installs into a throwaway venv, runs `bakudo demo`
      # (offline) from an empty cwd.
      - name: Wheel smoke
        run: make wheel-smoke
