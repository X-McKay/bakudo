# Python CI for bakudo.
#
# Mirrors `make check` (ruff + mypy + pytest) plus an offline smoke test of
# the operator surface, on the same interpreters the package supports.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api,temporal]"
      - name: Lint
        run: ruff check src tests
      # python -m avoids any stale mypy/pytest shadowing the venv's on PATH.
      - name: Type-check
        run: python -m mypy src/bakudo
      - name: Test
        run: python -m pytest
      # The graders grading themselves: a deterministic FauxDriver corpus
      # through the real pipeline, compared against the committed baseline.
      # Drift fails the build until reviewed (scripts/eval_gate.py --update).
      - name: Eval gate
        run: python scripts/eval_gate.py
      - name: Smoke
        run: |
          bakudo validate-spec agents/add-feature.yaml
          bakudo validate-spec agents/optimize-scout.yaml
          bakudo validate-spec agents/optimize-attempt.yaml
          bakudo demo
          bakudo optimize --repo bakudo --title "CI smoke" --rounds 1
