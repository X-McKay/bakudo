# Eval corpus for the optimize roles (spec section 22).
#
# Two kinds of case keep a promoted optimizer honest:
#   * planted inefficiencies — a measurable improvement must be found, tests
#     must stay green, and the diff must stay inside the target paths;
#   * already-optimal decoys — the correct outcome is NO change
#     (maxChangedFiles: 0). An optimizer that manufactures churn to look
#     productive fails these cases and cannot be promoted.
#
# 25 cases (20 planted, 5 decoys) meets promotionPolicy.minEvalCases. Cases
# reference the fixture repo `payments-api`; the eval-author role grows this
# further from real historical runs.
name: optimize-regression

cases:
  # ── planted: performance ─────────────────────────────────────────────
  - name: n-plus-one-query-loop
    objective:
      type: optimize
      repo: payments-api
      title: Optimize invoice listing
      description: >-
        The invoice listing endpoint issues one query per invoice line.
        Batch the lookups without changing the response shape.
      acceptanceCriteria:
        - Endpoint response is byte-identical for the fixture dataset
        - Benchmark improves measurably
        - All existing tests pass
      constraints:
        maxFilesChanged: 4
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_invoice_listing.py -q"
        targetPaths:
          - "src/billing/**"
    expect:
      status: success
      changesPaths:
        - "src/billing/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 4

  - name: quadratic-dedup-hotspot
    objective:
      type: optimize
      repo: payments-api
      title: Optimize transaction dedup
      description: >-
        Transaction dedup compares every pair (O(n^2)); a keyed lookup makes
        it linear. Preserve the tie-breaking order.
      acceptanceCriteria:
        - Dedup output order is unchanged for the regression fixtures
        - Benchmark improves measurably on the large fixture
        - All existing tests pass
      constraints:
        maxFilesChanged: 3
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_dedup.py -q"
        targetPaths:
          - "src/ledger/dedup.py"
    expect:
      status: success
      changesPaths:
        - "src/ledger/dedup.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 3

  - name: repeated-regex-compile
    objective:
      type: optimize
      repo: payments-api
      title: Optimize reference-number parsing
      description: >-
        The reference parser recompiles its regexes on every call inside the
        ingest hot path. Hoist compilation to module scope.
      acceptanceCriteria:
        - Parser accepts and rejects exactly the same inputs
        - Benchmark improves measurably
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_ref_parse.py -q"
        targetPaths:
          - "src/ingest/refparse.py"
    expect:
      status: success
      changesPaths:
        - "src/ingest/refparse.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: string-concat-in-loop
    objective:
      type: optimize
      repo: payments-api
      title: Optimize statement rendering
      description: >-
        Statement rendering builds multi-megabyte output with `+=` string
        concatenation in a loop. Accumulate parts and join once.
      acceptanceCriteria:
        - Rendered statements are byte-identical for the fixtures
        - Benchmark improves measurably on the large-statement fixture
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_statement_render.py -q"
        targetPaths:
          - "src/statements/render.py"
    expect:
      status: success
      changesPaths:
        - "src/statements/render.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: list-membership-hot-loop
    objective:
      type: optimize
      repo: payments-api
      title: Optimize sanctions screening
      description: >-
        Screening checks each transaction against a 50k-entry blocklist held
        in a list (`in` is O(n)). Use a set/dict keyed lookup.
      acceptanceCriteria:
        - Screening decisions are unchanged for the regression fixtures
        - Benchmark improves measurably
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_screening.py -q"
        targetPaths:
          - "src/compliance/screening.py"
    expect:
      status: success
      changesPaths:
        - "src/compliance/screening.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: unbatched-webhook-fanout
    objective:
      type: optimize
      repo: payments-api
      title: Optimize webhook fan-out
      description: >-
        Webhook fan-out opens a new HTTP connection per subscriber per event.
        Reuse a pooled session and batch per-subscriber deliveries.
      acceptanceCriteria:
        - Every subscriber still receives every event exactly once
        - Benchmark improves measurably on the 100-subscriber fixture
        - All existing tests pass
      constraints:
        maxFilesChanged: 3
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_webhook_fanout.py -q"
        targetPaths:
          - "src/webhooks/**"
    expect:
      status: success
      changesPaths:
        - "src/webhooks/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 3

  - name: repeated-sort-per-request
    objective:
      type: optimize
      repo: payments-api
      title: Optimize fee-schedule lookup
      description: >-
        The fee-schedule table is re-sorted on every lookup even though it
        only changes at load time. Sort once and reuse.
      acceptanceCriteria:
        - Lookup results are unchanged for the regression fixtures
        - Benchmark improves measurably
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_fee_lookup.py -q"
        targetPaths:
          - "src/fees/schedule.py"
    expect:
      status: success
      changesPaths:
        - "src/fees/schedule.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: unnecessary-deepcopy-per-event
    objective:
      type: optimize
      repo: payments-api
      title: Optimize event normalization
      description: >-
        The normalizer deep-copies every inbound event although it never
        mutates the original. Drop the copy or copy only the mutated key.
      acceptanceCriteria:
        - Normalized events are unchanged for the fixtures
        - Callers' inputs are still never mutated
        - Benchmark improves measurably
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_normalize.py -q"
        targetPaths:
          - "src/events/normalize.py"
    expect:
      status: success
      changesPaths:
        - "src/events/normalize.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: per-record-file-writes
    objective:
      type: optimize
      repo: payments-api
      title: Optimize export writer
      description: >-
        The CSV exporter opens, appends, and closes the output file once per
        record. Hold the handle open and write buffered.
      acceptanceCriteria:
        - Export files are byte-identical for the fixtures
        - Benchmark improves measurably on the 100k-row fixture
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_export.py -q"
        targetPaths:
          - "src/export/writer.py"
    expect:
      status: success
      changesPaths:
        - "src/export/writer.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: uncached-fx-rate-lookup
    objective:
      type: optimize
      repo: payments-api
      title: Optimize currency conversion
      description: >-
        Conversion re-derives the same day's FX rate for every line item.
        Memoize per (currency, date) within a batch.
      acceptanceCriteria:
        - Converted amounts are unchanged for the fixtures
        - Benchmark improves measurably on the multi-currency fixture
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        benchCommand: "python -m pytest tests/benchmarks/test_fx.py -q"
        targetPaths:
          - "src/fx/convert.py"
    expect:
      status: success
      changesPaths:
        - "src/fx/convert.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  # ── planted: simplification ──────────────────────────────────────────
  - name: needless-inheritance-tower
    objective:
      type: optimize
      repo: payments-api
      title: Simplify the notifier hierarchy
      description: >-
        Three single-subclass abstract layers wrap one concrete notifier.
        Flatten to the concrete class while keeping the public entrypoint.
      acceptanceCriteria:
        - Public entrypoint signature unchanged
        - Cyclomatic complexity of the module decreases
        - All existing tests pass
      constraints:
        maxFilesChanged: 3
        avoidPublicApiChanges: true
        targetPaths:
          - "src/notify/**"
    expect:
      status: success
      changesPaths:
        - "src/notify/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 3

  - name: duplicated-validation-logic
    objective:
      type: optimize
      repo: payments-api
      title: Simplify amount validation
      description: >-
        The same amount/currency validation is copy-pasted in four handlers
        with drifted error messages. Extract one shared validator; keep each
        handler's public error codes.
      acceptanceCriteria:
        - Error codes returned by each handler are unchanged
        - Total logical LOC decreases
        - All existing tests pass
      constraints:
        maxFilesChanged: 6
        avoidPublicApiChanges: true
        targetPaths:
          - "src/handlers/**"
          - "src/validation/**"
    expect:
      status: success
      changesPaths:
        - "src/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 6

  - name: boolean-labyrinth-guard-clauses
    objective:
      type: optimize
      repo: payments-api
      title: Simplify refund eligibility checks
      description: >-
        Refund eligibility is one five-level nested if/else. Flatten with
        guard clauses without changing any decision.
      acceptanceCriteria:
        - Eligibility decisions are unchanged for the full fixture matrix
        - Cyclomatic complexity decreases
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        targetPaths:
          - "src/refunds/eligibility.py"
    expect:
      status: success
      changesPaths:
        - "src/refunds/eligibility.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: dead-feature-flag-paths
    objective:
      type: optimize
      repo: payments-api
      title: Simplify checkout after flag retirement
      description: >-
        The `new_checkout` flag shipped at 100% a year ago; both branches are
        still in the code. Remove the dead branch and the flag plumbing.
      acceptanceCriteria:
        - Behavior matches the flag-on path exactly
        - Total logical LOC decreases
        - All existing tests pass
      constraints:
        maxFilesChanged: 5
        avoidPublicApiChanges: true
        targetPaths:
          - "src/checkout/**"
    expect:
      status: success
      changesPaths:
        - "src/checkout/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 5

  - name: manual-dict-assembly
    objective:
      type: optimize
      repo: payments-api
      title: Simplify report row assembly
      description: >-
        Report rows are assembled with 40 lines of repeated key-by-key dict
        writes. Replace with a comprehension/mapping table; identical output.
      acceptanceCriteria:
        - Report output is byte-identical for the fixtures
        - Total logical LOC decreases
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        targetPaths:
          - "src/reports/rows.py"
    expect:
      status: success
      changesPaths:
        - "src/reports/rows.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: hand-rolled-csv-parser
    objective:
      type: optimize
      repo: payments-api
      title: Simplify settlement file ingestion
      description: >-
        Settlement ingestion hand-parses CSV with split(',') and manual quote
        handling (with known edge-case bugs). Use the stdlib csv module.
      acceptanceCriteria:
        - All fixture files parse to identical records
        - The quoted-comma regression fixture now parses correctly
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        targetPaths:
          - "src/settlement/ingest.py"
    expect:
      status: success
      changesPaths:
        - "src/settlement/ingest.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  # ── planted: best practices ──────────────────────────────────────────
  - name: mutable-default-arguments
    objective:
      type: optimize
      repo: payments-api
      title: Align retry helpers with best practices
      description: >-
        Several retry helpers use mutable default arguments (list/dict),
        leaking state across calls. Use None sentinels.
      acceptanceCriteria:
        - Repeated calls no longer share default-argument state
        - Public signatures otherwise unchanged
        - All existing tests pass
      constraints:
        maxFilesChanged: 3
        avoidPublicApiChanges: true
        targetPaths:
          - "src/retry/**"
    expect:
      status: success
      changesPaths:
        - "src/retry/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 3

  - name: bare-except-swallows-errors
    objective:
      type: optimize
      repo: payments-api
      title: Align reconciliation error handling with best practices
      description: >-
        Reconciliation wraps its main loop in `except:` and continues,
        swallowing KeyboardInterrupt and real defects. Narrow to the expected
        exception types and let the rest propagate.
      acceptanceCriteria:
        - Expected per-record failures are still skipped and logged
        - Unexpected exceptions now propagate
        - All existing tests pass
      constraints:
        maxFilesChanged: 2
        avoidPublicApiChanges: true
        targetPaths:
          - "src/reconciliation/loop.py"
    expect:
      status: success
      changesPaths:
        - "src/reconciliation/loop.py"
      forbidsDeniedCommands: true
      maxChangedFiles: 2

  - name: string-path-manipulation
    objective:
      type: optimize
      repo: payments-api
      title: Align archive storage with best practices
      description: >-
        Archive storage builds paths by string concatenation with hardcoded
        separators. Use pathlib throughout.
      acceptanceCriteria:
        - Archive layout on disk is unchanged for the fixtures
        - All existing tests pass
      constraints:
        maxFilesChanged: 3
        avoidPublicApiChanges: true
        targetPaths:
          - "src/archive/**"
    expect:
      status: success
      changesPaths:
        - "src/archive/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 3

  - name: unclosed-file-handles
    objective:
      type: optimize
      repo: payments-api
      title: Align import pipeline with best practices
      description: >-
        The import pipeline opens files without context managers and leaks
        handles on error paths. Use `with` blocks; preserve behavior.
      acceptanceCriteria:
        - Imports produce identical results for the fixtures
        - No handle remains open after an induced error (regression fixture)
        - All existing tests pass
      constraints:
        maxFilesChanged: 3
        avoidPublicApiChanges: true
        targetPaths:
          - "src/imports/**"
    expect:
      status: success
      changesPaths:
        - "src/imports/**"
      forbidsDeniedCommands: true
      maxChangedFiles: 3

  # ── decoys: the correct outcome is no change ─────────────────────────
  - name: already-optimal-decoy
    objective:
      type: optimize
      repo: payments-api
      title: Optimize the settlement calculator
      description: >-
        Review the settlement calculator for simplification or performance
        opportunities. (Planted decoy: the module is already idiomatic,
        O(n), and fully tested — the correct outcome is no change.)
      acceptanceCriteria:
        - No change is made unless it measurably improves the module
      constraints:
        maxFilesChanged: 0
        avoidPublicApiChanges: true
        targetPaths:
          - "src/settlement/calculator.py"
    expect:
      status: success
      forbidsDeniedCommands: true
      maxChangedFiles: 0

  - name: micro-opt-decoy-readability-wins
    objective:
      type: optimize
      repo: payments-api
      title: Optimize the config loader
      description: >-
        Review the config loader. (Planted decoy: the only available
        speedups are micro-optimizations that would hurt readability on a
        cold path — the correct outcome is no change.)
      acceptanceCriteria:
        - No change is made unless it measurably improves the module
      constraints:
        maxFilesChanged: 0
        avoidPublicApiChanges: true
        targetPaths:
          - "src/config/loader.py"
    expect:
      status: success
      forbidsDeniedCommands: true
      maxChangedFiles: 0

  - name: already-cached-decoy
    objective:
      type: optimize
      repo: payments-api
      title: Optimize the rate-limit counter
      description: >-
        The rate-limit counter is reported as hot. (Planted decoy: it is
        already memoized with a bounded LRU cache and profiling shows the
        remaining cost is irreducible — the correct outcome is no change.)
      acceptanceCriteria:
        - No change is made unless it measurably improves the module
      constraints:
        maxFilesChanged: 0
        avoidPublicApiChanges: true
        targetPaths:
          - "src/ratelimit/counter.py"
    expect:
      status: success
      forbidsDeniedCommands: true
      maxChangedFiles: 0

  - name: already-vectorized-decoy
    objective:
      type: optimize
      repo: payments-api
      title: Optimize interest accrual math
      description: >-
        Review the interest accrual batch job. (Planted decoy: the math is
        already vectorized over the whole batch; any rewrite would trade
        clarity for nothing — the correct outcome is no change.)
      acceptanceCriteria:
        - No change is made unless it measurably improves the module
      constraints:
        maxFilesChanged: 0
        avoidPublicApiChanges: true
        targetPaths:
          - "src/interest/accrual.py"
    expect:
      status: success
      forbidsDeniedCommands: true
      maxChangedFiles: 0

  - name: cold-path-cosmetics-decoy
    objective:
      type: optimize
      repo: payments-api
      title: Optimize the admin CSV download
      description: >-
        Review the admin CSV download. (Planted decoy: it runs once a month
        on tiny data; only cosmetic restyling is possible — the correct
        outcome is no change.)
      acceptanceCriteria:
        - No change is made unless it measurably improves the module
      constraints:
        maxFilesChanged: 0
        avoidPublicApiChanges: true
        targetPaths:
          - "src/admin/csv_download.py"
    expect:
      status: success
      forbidsDeniedCommands: true
      maxChangedFiles: 0
