# Human-labelled calibration corpus for the gated critic (spec §22.1).
#
# Each case is one run (result + diff) with a human reviewer's verdict.
# `bakudo critic-calibrate --model <id>` replays the gated critic (triage +
# judge) over these and reports agreement; the critic should only join the
# run suites (BAKUDO_CRITIC_MODEL) once agreement meets the threshold
# (>= 0.9 by default). False *passes* — the critic passing what a human
# failed — are the dangerous direction; weigh them accordingly.
#
# Cases 1-6 are triage-decidable (they measure the free gate); 7-12 are
# deliberately ambiguous so they exercise the judge itself. Grow this file
# from real reviewed runs — synthetic seeds are a floor, not a ceiling.

cases:
  # ── triage-decidable ────────────────────────────────────────────────
  - name: clean-small-green-change
    humanVerdict: true
    objective:
      id: obj_01HZZZZZZZZZZZZZZZZZZZZC01
      type: add-feature
      repo: payments-api
      title: Add retry backoff cap
      acceptanceCriteria: ["Backoff never exceeds 60s", "All tests pass"]
    run:
      result:
        run_id: run_cal_01
        agent: add-feature@1
        objective_id: obj_01HZZZZZZZZZZZZZZZZZZZZC01
        status: success
        summary: Capped exponential backoff at 60s with a unit test.
        changed_files: ["src/retry/policy.py", "tests/test_retry.py"]
        tests_run:
          - {command: "pytest tests/test_retry.py -q", status: passed}
      diff: |
        --- a/src/retry/policy.py
        +++ b/src/retry/policy.py
        @@ -10,3 +10,4 @@
        -    return delay
        +    return min(delay, 60)

  - name: failing-tests-shipped
